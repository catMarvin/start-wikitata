<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>wikiTaTa — Developer Setup</title>
<script src="https://unpkg.com/xterm@5.3.0/lib/xterm.js"></script>
<link rel="stylesheet" href="https://unpkg.com/xterm@5.3.0/css/xterm.css">
<script src="https://unpkg.com/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
<style>
:root {
  --bg:#0a0a0f;--sf:#111118;--sf2:#18181f;--bd:#252530;--tx:#e0e0e8;--tx2:#777788;
  --acc:#6c8aff;--acc-d:rgba(108,138,255,.12);--grn:#4ade80;--grn-d:rgba(74,222,128,.1);
  --red:#f87171;--red-d:rgba(248,113,113,.1);--gold:#d4a24e;--gold-d:rgba(212,162,78,.1);
  --code:#0d0d16;--r:10px;
  --f:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
  --m:'SF Mono','Fira Code',Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--f);background:var(--bg);color:var(--tx);min-height:100vh}
.wrap{max-width:660px;margin:0 auto;padding:40px 20px 80px}
.hdr{text-align:center;margin-bottom:32px}
.hdr h1{font-size:26px;font-weight:600;letter-spacing:-.3px;margin-bottom:6px}
.hdr p{color:var(--tx2);font-size:14px}

/* Progress */
.prog{display:flex;gap:3px;margin-bottom:24px}
.prog .s{flex:1;height:3px;border-radius:2px;background:var(--bd);transition:background .4s}
.prog .s.done{background:var(--grn)} .prog .s.cur{background:var(--acc)}

/* Level picker */
.levels{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.lvl{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);padding:14px 18px;cursor:pointer;transition:all .2s}
.lvl:hover{border-color:var(--acc)} .lvl.sel{border-color:var(--acc);background:var(--acc-d)}
.lvl h3{font-size:14px;font-weight:500;margin-bottom:3px} .lvl p{font-size:12px;color:var(--tx2);line-height:1.4}

/* Steps */
.step{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:8px;overflow:hidden;transition:all .3s}
.step.locked{opacity:.3;pointer-events:none} .step.cur{border-color:var(--acc);opacity:1}
.step.done{border-color:var(--grn-d);opacity:.6} .step.done:hover{opacity:.8}
.step.skip{display:none}

.sh{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:default;user-select:none}
.sn{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;background:var(--bd);color:var(--tx2)}
.step.cur .sn{background:var(--acc);color:#fff} .step.done .sn{background:var(--grn-d);color:var(--grn)}
.st{font-size:14px;font-weight:500} .sc{margin-left:auto;color:var(--grn);font-size:16px;display:none}
.step.done .sc{display:block}

.sb{display:none;padding:0 18px 18px 56px} .step.cur .sb{display:block}
.sb p{font-size:13px;color:var(--tx2);line-height:1.6;margin-bottom:12px}
.sb p b,.sb p strong{color:var(--tx);font-weight:500}

/* Buttons */
.btn{border:none;padding:8px 18px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;font-family:var(--f);transition:all .15s}
.btn-p{background:var(--acc);color:#fff} .btn-p:hover{filter:brightness(1.1)}
.btn-g{background:var(--grn-d);color:var(--grn);border:1px solid rgba(74,222,128,.2)} .btn-g:hover{background:rgba(74,222,128,.15)}
.btn-o{background:transparent;color:var(--tx2);border:1px solid var(--bd)} .btn-o:hover{border-color:var(--tx2)}
.btn-r{background:var(--red-d);color:var(--red);border:1px solid rgba(248,113,113,.2)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* Command blocks */
.cmd{background:var(--code);border:1px solid var(--bd);border-radius:8px;padding:11px 14px;padding-right:60px;margin-bottom:8px;position:relative;font-family:var(--m);font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-all}
.cmd .cp{position:absolute;top:7px;right:7px;background:var(--bd);border:none;color:var(--tx2);padding:3px 8px;border-radius:4px;font-size:10px;cursor:pointer;font-family:var(--f)}
.cmd .cp:hover{background:var(--acc-d);color:var(--acc)} .cmd .cp.ok{background:var(--grn-d);color:var(--grn)}

/* Notes */
.note{background:var(--code);border-left:3px solid var(--acc);padding:9px 14px;margin-bottom:12px;border-radius:0 6px 6px 0;font-size:11px;color:var(--tx2);line-height:1.5}
.note.warn{border-left-color:var(--gold)} .note.err{border-left-color:var(--red)}

/* Test result */
.test-area{margin-top:10px;margin-bottom:10px}
.test-area textarea{width:100%;height:60px;font-size:11px;font-family:var(--m);background:var(--code);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:8px;resize:vertical}
.test-result{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;font-size:12px;font-weight:500;margin-top:8px}
.test-result.pass{background:var(--grn-d);color:var(--grn)} .test-result.fail{background:var(--red-d);color:var(--red)}

/* Input */
.irow{display:flex;gap:8px;margin-bottom:12px}
.irow input{flex:1;background:var(--code);border:1px solid var(--bd);border-radius:8px;padding:9px 12px;color:var(--tx);font-size:13px;font-family:var(--f);outline:none}
.irow input:focus{border-color:var(--acc)}

/* Sub-steps */
.sub{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--bd)} .sub:last-of-type{border-bottom:none}
.sub-label{font-size:11px;font-weight:600;color:var(--acc);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}

/* Finale */
.fin{text-align:center;padding:40px 0;display:none}
.fin h2{font-size:20px;color:var(--grn);margin-bottom:6px}
.fin p{color:var(--tx2);font-size:14px;margin-bottom:20px;line-height:1.5}

/* Terminal panel */
.term-panel{position:fixed;bottom:0;left:0;right:0;background:#0a0a0a;border-top:2px solid var(--bd);z-index:1000;transition:height .3s}
.term-panel.collapsed{height:36px} .term-panel.expanded{height:260px}
.term-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;cursor:pointer;user-select:none}
.term-bar .dot{width:8px;height:8px;border-radius:50%;margin-right:8px;transition:background .3s}
.term-bar .dot.off{background:#555} .term-bar .dot.on{background:var(--grn)}
.term-bar span{font-size:11px;color:var(--tx2);font-family:var(--m)}
.term-bar .toggle{font-size:10px;color:var(--tx2);border:1px solid var(--bd);background:none;padding:2px 10px;border-radius:4px;cursor:pointer;font-family:var(--f)}
#xterm-box{height:calc(100% - 36px);overflow:hidden;padding:2px 4px}
.xterm{height:100%!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <h1>Developer Setup</h1>
    <p>Get your Mac configured for wikiTaTa development</p>
  </div>
  <div class="prog" id="prog"></div>
  <div id="steps"></div>
  <div class="fin" id="fin">
    <h2>You're all set</h2>
    <p>Claude Code is connected to wikiTaTa.<br>Open a terminal, type <code style="background:var(--code);padding:2px 6px;border-radius:4px">claude</code>, and say <code style="background:var(--code);padding:2px 6px;border-radius:4px">start session sop</code>.</p>
  </div>
</div>

<!-- Terminal panel (fixed bottom) -->
<div class="term-panel collapsed" id="term-panel">
  <div class="term-bar" onclick="termToggle()">
    <div style="display:flex;align-items:center">
      <span class="dot off" id="term-dot"></span>
      <span id="term-status">Terminal — not connected</span>
    </div>
    <button class="toggle" id="term-toggle-btn">Show</button>
  </div>
  <div id="xterm-box"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// LOBBY SUPABASE CONFIG (safe to expose — RLS locked, free-tier sandbox)
// ═══════════════════════════════════════════════════════════════
const LOBBY_URL = 'https://mjdkuxfddfihqkknfxrl.supabase.co';
const LOBBY_KEY = 'sb_publishable_tQGS3ws4EztkCVxulXP4Ng_dfmoW-iY';

async function lobbyRpc(fn, params) {
  const res = await fetch(LOBBY_URL + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'apikey': LOBBY_KEY, 'Authorization': 'Bearer ' + LOBBY_KEY },
    body: JSON.stringify(params)
  });
  return res.json();
}

// ═══════════════════════════════════════════════════════════════
// XTERM TERMINAL
// ═══════════════════════════════════════════════════════════════
let _xterm = null, _xtermFit = null, _ws = null, _wsConnected = false;
let _outputBuffer = '';

function termToggle() {
  const panel = document.getElementById('term-panel');
  const btn = document.getElementById('term-toggle-btn');
  const collapsed = panel.classList.contains('collapsed');
  panel.classList.toggle('collapsed', !collapsed);
  panel.classList.toggle('expanded', collapsed);
  btn.textContent = collapsed ? 'Hide' : 'Show';
  if (collapsed) termInit();
  setTimeout(() => { try { _xtermFit?.fit(); } catch(_) {} }, 100);
}

function termInit() {
  if (_xterm) { try { _xtermFit?.fit(); } catch(_) {} return; }
  if (!window.Terminal) { setTimeout(termInit, 300); return; }
  const box = document.getElementById('xterm-box');
  _xterm = new window.Terminal({
    theme: { background:'#0a0a0a', foreground:'#ccc', cursor:'#22cc55' },
    fontFamily: 'ui-monospace,Menlo,monospace', fontSize: 12,
    cursorBlink: true, scrollback: 2000, convertEol: true
  });
  const FA = window.FitAddon?.FitAddon;
  if (FA) { _xtermFit = new FA(); _xterm.loadAddon(_xtermFit); }
  _xterm.open(box);
  setTimeout(() => { try { _xtermFit?.fit(); } catch(_) {} _xterm.focus(); }, 50);
  new ResizeObserver(() => { try { _xtermFit?.fit(); } catch(_) {} }).observe(box);
  _xterm.onData(data => { if (_ws?.readyState === 1) _ws.send(JSON.stringify({type:'input', data})); });
  termConnect();
}

function termConnect() {
  const dot = document.getElementById('term-dot');
  const status = document.getElementById('term-status');
  try {
    if (_ws && _ws.readyState < 2) _ws.close();
    _ws = new WebSocket('ws://127.0.0.1:3737');
    _ws.onopen = () => {
      _wsConnected = true;
      if (dot) dot.classList.replace('off','on');
      if (status) status.textContent = 'Terminal — connected';
    };
    _ws.onmessage = ev => {
      try {
        const msg = JSON.parse(ev.data);
        if (msg.type === 'output' || msg.type === 'echo') {
          _xterm?.write(msg.data);
          _outputBuffer += msg.data;
          if (_outputBuffer.length > 8000) _outputBuffer = _outputBuffer.slice(-4000);
        }
      } catch(_) {}
    };
    _ws.onclose = () => {
      _wsConnected = false;
      if (dot) dot.classList.replace('on','off');
      if (status) status.textContent = 'Terminal — not connected';
    };
    _ws.onerror = () => {};
  } catch(_) {}
}

function termSendCmd(cmd) {
  if (!_wsConnected) {
    termToggle(); // open panel
    setTimeout(() => termSendCmd(cmd), 500);
    return;
  }
  _outputBuffer = ''; // reset buffer for test capture
  const panel = document.getElementById('term-panel');
  if (panel.classList.contains('collapsed')) termToggle();
  _ws.send(JSON.stringify({ type:'input', data: cmd + '\r' }));
  _xterm?.focus();
}

// Auto-connect on load (silent — won't error if server not running)
setTimeout(termConnect, 1000);

// ═══════════════════════════════════════════════════════════════
// STEP DEFINITIONS
// ═══════════════════════════════════════════════════════════════
const STEPS = [
  // ── Level picker (always shown) ──
  { id:'level', title:'What do you need?', always:true, type:'level' },

  // ── Identity (always) ──
  { id:'user', title:'Your wikiTaTa username', always:true, type:'input',
    prompt:'Todd assigned you a username when he added you to the system.',
    inputId:'inp-user', placeholder:'e.g. dome', onSubmit:'setUser' },
  { id:'email', title:'Your Git email', always:true, type:'input',
    prompt:'The email associated with your GitHub account.',
    inputId:'inp-email', placeholder:'you@example.com', onSubmit:'setEmail' },

  // ── Full setup steps ──
  { id:'xcode', title:'Developer Tools (Git)', needs:'full',
    prompt:'Installs Git and command-line tools. A popup appears — click <strong>Install</strong>.',
    test:'git --version', testPass:/git version \d/i,
    install:'xcode-select --install',
    installNote:'If it says "already installed" you\'re good.' },

  { id:'ssh', title:'SSH Key for GitHub', needs:'full', type:'multi',
    prompt:'Generate an SSH key and add it to GitHub so you can clone private repos.',
    subs:[
      { label:'Generate key', cmdId:'cmd-ssh', cmd:'ssh-keygen -t ed25519 -C "YOUR_EMAIL"', note:'Press Enter for all prompts (no passphrase).' },
      { label:'Copy public key', cmd:'pbcopy < ~/.ssh/id_ed25519.pub' },
      { label:'Add to GitHub', cmd:'open https://github.com/settings/keys', note:'Click <strong>New SSH Key</strong>, paste, save.' },
      { label:'Test connection', cmd:'ssh -T git@github.com 2>&1', note:'Should say "Hi [username]! You\'ve successfully authenticated."' }
    ],
    test:'ssh -T git@github.com 2>&1', testPass:/successfully authenticated/i },

  { id:'node', title:'Node.js', needs:'full',
    prompt:'Node.js is required for Claude Code and other CLI tools.',
    test:'node -v', testPass:/^v(1[89]|2\d|[3-9]\d)/,
    install:'curl -fsSL https://fnm.vercel.app/install | bash && source ~/.zshrc && fnm install --lts',
    installNote:'Uses fnm (fast node manager) to install the latest LTS.' },

  { id:'brew', title:'Homebrew', needs:'full', optional:true,
    prompt:'Package manager for macOS. Makes installing tools easier.',
    test:'brew --version', testPass:/homebrew/i,
    install:'/bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"',
    installNote:'Follow the instructions it prints to add brew to your PATH.' },

  { id:'docker', title:'Docker', needs:'full', optional:true,
    prompt:'Needed for running Supabase locally and containerized services.',
    test:'docker --version', testPass:/docker version/i,
    install:'open https://docs.docker.com/desktop/setup/install/mac-install/',
    installNote:'Download Docker Desktop. Free for personal use.' },

  { id:'postgres', title:'PostgreSQL', needs:'full', optional:true,
    prompt:'Local database for offline development and shell tool integration.',
    test:'psql --version', testPass:/psql.*\d+\.\d+/i,
    install:'open https://postgresapp.com/',
    installNote:'Download Postgres.app, move to Applications, open it.' },

  // ── Dev tools steps ──
  { id:'cli', title:'CLI Tools', needs:'full,dev',
    prompt:'Install Claude Code, Supabase CLI, and Vercel CLI.',
    test:'claude --version 2>&1 && echo "---" && supabase --version 2>&1 && echo "---" && vercel --version 2>&1',
    testPass:/claude|supabase|vercel/i,
    install:'npm install -g @anthropic-ai/claude-code supabase vercel' },

  // ── Clone + config (always for dev+) ──
  { id:'clone', title:'Clone wikiTaTa repo', needs:'full,dev',
    prompt:'Clone the repo that contains the MCP server and shell tools.',
    test:'ls ~/git/wikitata/wt-mcp-server/index.js 2>&1', testPass:/index\.js/,
    install:'mkdir -p ~/git && git clone git@github.com:catMarvin/wikitata.git ~/git/wikitata',
    installNote:'If SSH fails, check your key is added to GitHub (step above).' },

  { id:'config', title:'Configure Claude Code', always:true,
    prompt:'Creates ~/.claude/ config files — MCP servers, permissions, universal bootstrap.',
    test:'cat ~/.claude/.mcp.json 2>&1 | head -5', testPass:/mcpServers/,
    install:'bash ~/git/wikitata/setup-claude.sh',
    installNote:'When it asks for username, enter your wikiTaTa username.' },

  { id:'shell', title:'Shell Tools', needs:'full,dev',
    prompt:'Add wikiTaTa terminal functions (wt_autolink, wt_start, wt_end) to your shell.',
    test:'source ~/.zshrc 2>/dev/null; type wt_autolink 2>&1', testPass:/function|alias/i,
    install:'echo \'source ~/git/wikitata/shell-scripts/wikitata_env.sh 2>/dev/null\' >> ~/.zshrc && source ~/.zshrc' },

  // ── Launch ──
  { id:'launch', title:'Launch Claude Code', always:true, type:'launch' }
];

// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
let level = null, username = '', email = '';
let stepStates = {}; // id -> 'done'|'skip'|'fail'|'pending'
let visible = [];    // filtered step list
let curIdx = 0;

// ═══════════════════════════════════════════════════════════════
// LEVEL PICKER
// ═══════════════════════════════════════════════════════════════
function pickLevel(lvl) {
  level = lvl;
  document.querySelectorAll('.lvl').forEach(e => e.classList.toggle('sel', e.dataset.lvl === lvl));
  buildVisible();
  advance('level');
}

function buildVisible() {
  visible = STEPS.filter(s => {
    if (s.always) return true;
    if (!s.needs) return false;
    if (level === 'full') return true;
    return s.needs.split(',').includes(level);
  });
  renderAll();
}

// ═══════════════════════════════════════════════════════════════
// RENDERING
// ═══════════════════════════════════════════════════════════════
function renderAll() {
  const ct = document.getElementById('steps');
  // Progress bar
  const pr = document.getElementById('prog');
  pr.innerHTML = visible.map((_,i) => `<div class="s${i<curIdx?' done':i===curIdx?' cur':''}"></div>`).join('');

  ct.innerHTML = visible.map((s, i) => {
    const state = stepStates[s.id] || 'pending';
    const cls = i < curIdx ? 'done' : i === curIdx ? 'cur' : 'locked';
    return `<div class="step ${cls}" data-id="${s.id}">${renderStep(s, i, state)}</div>`;
  }).join('');
}

function renderStep(s, idx, state) {
  let h = `<div class="sh"><div class="sn">${idx+1}</div><div class="st">${s.title}</div><div class="sc">&#10003;</div></div>`;
  h += `<div class="sb">`;

  if (s.type === 'level') {
    h += renderLevel();
  } else if (s.type === 'input') {
    h += `<p>${s.prompt}</p>`;
    h += `<div class="irow"><input type="${s.inputId==='inp-email'?'email':'text'}" id="${s.inputId}" placeholder="${s.placeholder}" autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')${s.onSubmit}()"><button class="btn btn-p" onclick="${s.onSubmit}()">Continue</button></div>`;
  } else if (s.type === 'launch') {
    h += renderLaunch();
  } else if (s.type === 'multi') {
    h += `<p>${s.prompt}</p>`;
    s.subs.forEach(sub => {
      const c = sub.cmd.replace(/YOUR_EMAIL/g, email || 'you@example.com');
      h += `<div class="sub"><div class="sub-label">${sub.label}</div>`;
      if (sub.note) h += `<p>${sub.note}</p>`;
      h += cmdBlock(c, sub.cmdId);
      h += `</div>`;
    });
    h += renderTestInstall(s, state);
  } else {
    h += `<p>${s.prompt}</p>`;
    h += renderTestInstall(s, state);
  }
  h += `</div>`;
  return h;
}

function renderLevel() {
  return `<p>Select what matches your situation. We'll skip steps you don't need.</p>
  <div class="levels">
    <div class="lvl${level==='full'?' sel':''}" data-lvl="full" onclick="pickLevel('full')">
      <h3>Full setup (fresh Mac)</h3>
      <p>Git, SSH, Node.js, Homebrew, Docker, Postgres, CLIs, shell config — everything.</p>
    </div>
    <div class="lvl${level==='dev'?' sel':''}" data-lvl="dev" onclick="pickLevel('dev')">
      <h3>Developer tools only</h3>
      <p>I have Git, SSH, and Node.js. Just need Claude Code, Supabase, Vercel, and wikiTaTa config.</p>
    </div>
    <div class="lvl${level==='claude'?' sel':''}" data-lvl="claude" onclick="pickLevel('claude')">
      <h3>Claude Code config only</h3>
      <p>Everything is installed. Just need the MCP connections and bootstrap config.</p>
    </div>
  </div>`;
}

function renderTestInstall(s, state) {
  let h = '';
  const testId = 'test-'+s.id;
  const resId = 'res-'+s.id;

  // Test section
  if (s.test) {
    h += `<div style="margin-top:4px">`;
    h += `<div style="font-size:11px;font-weight:600;color:var(--acc);margin-bottom:6px">TEST</div>`;
    h += cmdBlock(s.test);
    if (_wsConnected) {
      h += `<button class="btn btn-g" onclick="termRunTest('${s.id}')" style="margin-top:6px">Run Test in Terminal</button>`;
    } else {
      h += `<div class="test-area">`;
      h += `<textarea id="${testId}" placeholder="Paste the output here..."></textarea>`;
      h += `<button class="btn btn-g" onclick="runTest('${s.id}')" style="margin-top:6px">Check Result</button>`;
      h += `</div>`;
    }
    h += `<div id="${resId}"></div>`;
    h += `</div>`;
  }

  // Install section
  if (s.install) {
    h += `<div style="margin-top:8px">`;
    h += `<div style="font-size:11px;font-weight:600;color:var(--gold);margin-bottom:6px">INSTALL — if not found:</div>`;
    h += cmdBlock(s.install);
    if (s.installNote) h += `<div class="note warn">${s.installNote}</div>`;
    h += `</div>`;
  }

  // Action buttons
  h += `<div class="btns">`;
  h += `<button class="btn btn-p" onclick="advance('${s.id}')">Done</button>`;
  h += `<button class="btn btn-o" onclick="advance('${s.id}','skip')">I already have this</button>`;
  if (s.optional) h += `<button class="btn btn-o" onclick="advance('${s.id}','skip')">Skip — not needed</button>`;
  h += `</div>`;

  return h;
}

function renderLaunch() {
  return `<p>Open a <strong>new terminal window</strong>, then:</p>
  ${cmdBlock('claude')}
  <p>When Claude starts, say:</p>
  ${cmdBlock('start session sop')}
  <p>Claude will load your config from wikiTaTa and know who you are.</p>
  <div class="btns"><button class="btn btn-p" onclick="advance('launch')">Done — I'm in!</button></div>`;
}

function cmdBlock(text, id) {
  const idAttr = id ? ` id="${id}"` : '';
  const esc = text.replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const safeText = text.replace(/'/g, "\\'").replace(/\n/g, "\\n");
  const runBtn = `<span class="cp" onclick="termSendCmd('${safeText}')" style="right:52px;background:var(--grn-d);color:var(--grn)">Run</span>`;
  return `<div class="cmd"${idAttr}>${esc}${runBtn}<span class="cp" onclick="cc(this)">Copy</span></div>`;
}

// ═══════════════════════════════════════════════════════════════
// TEST
// ═══════════════════════════════════════════════════════════════
function runTest(stepId) {
  const s = STEPS.find(x => x.id === stepId);
  if (!s || !s.testPass) return;
  const ta = document.getElementById('test-' + stepId);
  const res = document.getElementById('res-' + stepId);
  if (!ta || !res) return;

  const output = ta.value.trim();
  if (!output) { res.innerHTML = '<div class="test-result fail">Paste the terminal output above first</div>'; return; }

  if (s.testPass.test(output)) {
    res.innerHTML = '<div class="test-result pass">&#10003; Passed — looks good</div>';
    stepStates[stepId] = 'done';
  } else {
    res.innerHTML = '<div class="test-result fail">&#10007; Not detected — try the install command below</div>';
    stepStates[stepId] = 'fail';
  }
}

function termRunTest(stepId) {
  const s = STEPS.find(x => x.id === stepId);
  if (!s || !s.test || !_wsConnected) return;
  const res = document.getElementById('res-' + stepId);
  if (res) res.innerHTML = '<div class="test-result" style="background:var(--acc-d);color:var(--acc)">Running...</div>';

  _outputBuffer = '';
  termSendCmd(s.test);

  // Wait for output to settle, then check
  setTimeout(() => {
    const output = _outputBuffer;
    if (!res) return;
    if (s.testPass.test(output)) {
      res.innerHTML = '<div class="test-result pass">&#10003; Passed</div>';
      stepStates[stepId] = 'done';
    } else {
      res.innerHTML = '<div class="test-result fail">&#10007; Not detected — try the install command below</div>';
      stepStates[stepId] = 'fail';
    }
  }, 2500);
}

// ═══════════════════════════════════════════════════════════════
// INPUT HANDLERS
// ═══════════════════════════════════════════════════════════════
function setUser() {
  const inp = document.getElementById('inp-user');
  const v = inp?.value.trim().toLowerCase();
  if (!v) { inp?.focus(); return; }
  username = v;
  // Patch display
  document.querySelectorAll('.user-echo').forEach(e => e.textContent = v);
  advance('user');
}

function setEmail() {
  const inp = document.getElementById('inp-email');
  const v = inp?.value.trim();
  if (!v || !v.includes('@')) { inp?.focus(); return; }
  email = v;
  // Patch SSH command
  const sshEl = document.getElementById('cmd-ssh');
  if (sshEl) {
    const txt = sshEl.childNodes[0];
    if (txt) txt.textContent = `ssh-keygen -t ed25519 -C "${v}"`;
  }
  advance('email');
}

// ═══════════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════════
function advance(stepId, action) {
  stepStates[stepId] = action || 'done';
  // Find index in visible
  const idx = visible.findIndex(s => s.id === stepId);
  if (idx >= 0) curIdx = idx + 1;

  if (curIdx >= visible.length) {
    renderAll();
    document.getElementById('fin').style.display = 'block';
    setTimeout(() => document.getElementById('fin').scrollIntoView({ behavior:'smooth', block:'center' }), 150);
  } else {
    renderAll();
    const next = document.querySelector('.step.cur');
    if (next) setTimeout(() => next.scrollIntoView({ behavior:'smooth', block:'center' }), 150);
  }
}

// ═══════════════════════════════════════════════════════════════
// COPY
// ═══════════════════════════════════════════════════════════════
function cc(btn) {
  const block = btn.parentElement;
  const text = block.textContent.replace(/Copy$/, '').replace(/Copied$/, '').trim();
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = 'Copied'; btn.classList.add('ok');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('ok'); }, 2000);
  });
}
