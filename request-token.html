<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Request a new activation link — wikiTaTa</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #0e0e14;
    color: #e4e4e7;
    font-family: "Inter Tight", system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .card {
    background: rgba(20,20,26,0.94);
    border: 1px solid rgba(167,139,250,0.28);
    border-radius: 16px;
    padding: 40px 36px;
    max-width: 460px;
    width: 100%;
    box-shadow: 0 16px 48px rgba(0,0,0,0.55), 0 0 80px rgba(139,92,246,0.1);
  }
  .logo {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: #f4f4f5;
    margin-bottom: 24px;
    text-align: center;
  }
  .logo span { color: #8b5cf6; }
  h1 {
    font-size: 20px;
    font-weight: 600;
    color: #f4f4f5;
    margin-bottom: 8px;
  }
  .sub {
    font-size: 14px;
    color: #c0c0c8;
    line-height: 1.55;
    margin-bottom: 28px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: #c4c4c8;
    margin-bottom: 6px;
  }
  input[type=text], input[type=email] {
    display: block;
    width: 100%;
    padding: 11px 14px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(167,139,250,0.25);
    border-radius: 8px;
    color: #f4f4f5;
    font-size: 15px;
    font-family: inherit;
    margin-bottom: 18px;
    outline: none;
    transition: border-color .15s;
  }
  input:focus { border-color: rgba(167,139,250,0.7); }
  input::placeholder { color: #555; }
  button[type=submit] {
    width: 100%;
    padding: 13px;
    background: rgba(139,92,246,0.88);
    color: #fff;
    border: none;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background .15s;
    margin-top: 4px;
  }
  button[type=submit]:hover { background: #8b5cf6; }
  button[type=submit]:disabled { opacity: 0.5; cursor: not-allowed; }
  .msg {
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.5;
    display: none;
  }
  .msg.success {
    background: rgba(34,197,94,0.12);
    border: 1px solid rgba(34,197,94,0.3);
    color: #86efac;
    display: block;
  }
  .msg.error {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.25);
    color: #fca5a5;
    display: block;
  }
  .msg.info {
    background: rgba(139,92,246,0.1);
    border: 1px solid rgba(139,92,246,0.25);
    color: #c4b5fd;
    display: block;
  }
  .footer-note {
    text-align: center;
    margin-top: 22px;
    font-size: 13px;
    color: #b8b8c4;
  }
  .footer-note a { color: #a78bfa; text-decoration: none; }
  .footer-note a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">wiki<span>TaTa</span></div>
  <h1>Request a new activation link</h1>
  <p class="sub">If your activation link has expired or you didn't receive one, enter your username and email below. A new link will be sent within a few minutes.</p>

  <form id="form" novalidate>
    <label for="username">Username</label>
    <input type="text" id="username" name="username" placeholder="your-username" autocomplete="username" autocapitalize="none" spellcheck="false" required>

    <label for="email">Email address</label>
    <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>

    <button type="submit" id="btn">Send activation link</button>
  </form>

  <div class="msg" id="msg" role="alert" aria-live="polite"></div>

  <p class="footer-note">
    Already have a link? Check your spam folder.<br>
    Need help? <a href="mailto:support@wikitata.com">support@wikitata.com</a>
  </p>
</div>

<script>
(function() {
  var SB_URL = 'https://onoujmfhlrhvcqzjniei.supabase.co';
  var form   = document.getElementById('form');
  var btn    = document.getElementById('btn');
  var msgEl  = document.getElementById('msg');

  function showMsg(type, text) {
    msgEl.className = 'msg ' + type;
    msgEl.textContent = text;
  }
  function clearMsg() {
    msgEl.className = 'msg';
    msgEl.textContent = '';
  }

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    clearMsg();

    var username = document.getElementById('username').value.trim().toLowerCase();
    var email    = document.getElementById('email').value.trim().toLowerCase();

    if (!username) { showMsg('error', 'Please enter your username.'); return; }
    if (!email || !email.includes('@')) { showMsg('error', 'Please enter a valid email address.'); return; }

    btn.disabled = true;
    btn.textContent = 'Sending…';

    fetch(SB_URL + '/functions/v1/request-token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, email_hint: email })
    })
    .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, status: r.status, data: d }; }); })
    .then(function(res) {
      btn.disabled = false;
      btn.textContent = 'Send activation link';
      if (res.data && res.data.ok) {
        showMsg('success', 'Request received — you’ll get a new activation link by email shortly. Check your inbox (and spam folder) in a few minutes.');
        form.reset();
      } else if (res.status === 429) {
        showMsg('info', res.data.error || 'You already requested a link recently. Please wait an hour before trying again.');
      } else if (res.status === 409) {
        showMsg('info', res.data.error || 'You already have a valid activation link — check your email.');
      } else {
        showMsg('error', (res.data && res.data.error) || 'Something went wrong. Please try again in a moment.');
      }
    })
    .catch(function() {
      btn.disabled = false;
      btn.textContent = 'Send activation link';
      showMsg('error', 'Could not reach wikiTaTa. Check your internet connection and try again.');
    });
  });
})();
</script>
</body>
</html>
